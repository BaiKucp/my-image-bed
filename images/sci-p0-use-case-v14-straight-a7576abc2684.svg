<text x="1130" y="1624" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#172033" >示教运维源于需求 §4.2，负责航线与作业参数维护；机载定位、飞控安全及测算算法由外部系统负责。</text>
<text x="1130" y="1655" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#172033" >具体角色权限仍待核对；同步码不等于成果文件。当前为整合核对稿，接口与数据结构尚未冻结。</text>
